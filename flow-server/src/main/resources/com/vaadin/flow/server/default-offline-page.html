<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <base href=".">
    <title>%%%PROJECT_NAME%%%</title>
    %%%META_ICONS%%%
    <meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">

    <style>
        .page {
            --offline-background: #fff;
            --offline-text: hsl(0, 0%, 10%);
            --offline-secondary-text: hsl(0, 0%, 40%);
            --offline-indicator: hsl(0, 0%, 72%);
            font-family: -apple-system, BlinkMacSystemFont, "Roboto", "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            font-size: 1rem;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            color: var(--offline-text);
            background: var(--offline-background);
            word-break: break-word;
            padding: 0;
            margin: 0;
        }

        @media (prefers-color-scheme: dark) {
            .page {
                --offline-background: #000;
                --offline-text: #fff;
                --offline-secondary-text: hsl(0, 0%, 62%);
                --offline-indicator: hsl(0, 0%, 40%);
            }
        }

        .offline {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }

        .offline .app-icon {
            width: 4rem;
            height: 4rem;
            object-fit: cover;
            /* Shown once the script below has checked the icon */
            visibility: hidden;
        }

        .offline .app-icon.checked {
            visibility: visible;
        }

        /* An opaque icon gets an app icon shape, a transparent one is shown as is */
        .offline .app-icon.opaque {
            border-radius: 22%;
            box-shadow: 0 1px 2px hsla(0, 0%, 0%, 0.12), 0 2px 8px hsla(0, 0%, 0%, 0.08);
        }

        /* No cached icon is available */
        .offline .app-icon[src=""] {
            display: none;
        }

        .offline .app-name {
            margin: 0.5rem 0 0;
            font-size: 1.125rem;
            font-weight: 600;
        }

        .offline .indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            margin: 1.5rem 0;
            color: var(--offline-secondary-text);
        }

        .offline .indicator .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--offline-indicator);
        }

        .offline .indicator svg {
            width: 1.5rem;
            height: 1.5rem;
            margin: 0.25rem 0;
        }

        .offline h1 {
            margin: 0;
            font-size: 1.75rem;
            font-weight: 600;
            line-height: 1.25;
        }

        .offline p {
            max-width: 17em;
            margin: 0.75rem 0 0;
            font-size: 1.125rem;
            color: var(--offline-secondary-text);
        }
    </style>
</head>
<body class="page">
<main id="offline" class="offline">
    <img class="app-icon" src="%%%LOGO_PATH%%%" alt="">
    <div class="app-name">%%%PROJECT_NAME%%%</div>
    <div class="indicator" aria-hidden="true">
        <span class="dot"></span>
        <span class="dot"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7.5 18.5h9.75a3.75 3.75 0 0 0 1.4-7.23A6 6 0 0 0 8 8.5"/>
            <path d="M5.2 10.4A4 4 0 0 0 7.5 18.5"/>
            <path d="M3.5 3.5l17 17"/>
        </svg>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>
    <h1>Connection Lost</h1>
    <p>Check your network connection and try reloading the page.</p>
</main>
<script>
    (function () {
        var icon = document.querySelector('.app-icon');
        function checkIcon() {
            /* Treat the icon as opaque unless its top-left pixel is fully transparent */
            try {
                var canvas = document.createElement('canvas');
                canvas.width = 1;
                canvas.height = 1;
                var context = canvas.getContext('2d');
                context.drawImage(icon, 0, 0);
                if (context.getImageData(0, 0, 1, 1).data[3] !== 0) {
                    icon.classList.add('opaque');
                }
            } catch (e) {
                /* The pixel can not be read, show the icon as is */
            }
            icon.classList.add('checked');
        }
        if (icon.complete && icon.naturalWidth > 0) {
            checkIcon();
        } else {
            icon.addEventListener('load', checkIcon);
        }
    })();
    window.addEventListener('online', function () {
        window.location.reload();
    });
</script>
</body>
</html>
