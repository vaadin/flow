# An nginx reverse proxy configuration tuned for Vaadin.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/proxy.crt;
    ssl_certificate_key /etc/nginx/proxy.key;

    location / {
        proxy_pass http://@BACKEND@;
        proxy_http_version 1.1;

        # Websocket push upgrades the connection
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Push messages have to reach the browser as soon as they are written
        proxy_buffering off;
        proxy_request_buffering off;

        # Push connections stay open while nothing is sent
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
