name: Vaadin Quarkus Validation
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    # Deliberately unfiltered by base branch, as in vaadin/flow, so that PRs
    # stacked on another feature branch are validated too, not only those
    # targeting main. PRs against a maintenance branch run that branch's own
    # copy of this file.
permissions:
  contents: read
concurrency:
  # Keyed on the workflow as well as the ref, so that a run of this workflow
  # does not cancel the ecosystem CI run for the same branch.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  _HEAD_REF: ${{ github.head_ref }}
  _HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  _REF_NAME: ${{ github.ref_name }}
  # The root pom targets release 21; the native image build needs GraalVM.
  JAVA_VERSION: '21'
  GRAALVM_VERSION: '25'
  NODE_VERSION: '24.21.0'
jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Concurrency Group = $GITHUB_WORKFLOW-${_HEAD_REF:-$_REF_NAME}"
      - name: Check secrets
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          TB_LICENSE: ${{ secrets.TB_LICENSE }}
        run: |
          [ -z "$TB_LICENSE" ] \
            && echo "🚫 **TB_LICENSE** is not defined, check that **${{github.repository}}** repo has a valid secret" \
            | tee -a $GITHUB_STEP_SUMMARY && exit 1 || exit 0
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{env._HEAD_SHA}}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Compile and Install Vaadin Quarkus
        run: |
          cmd="mvn install -B -ntp -DskipTests -DskipITs"
          eval $cmd -T 2C -q || eval $cmd
      - name: Save workspace
        # The test jobs pick the reactor up from here instead of building it
        # again: the production and development test modules each carry a
        # frontend bundle, so a rebuild per job costs minutes that the
        # download does not.
        run: |
          VERSION=$(mvn -N -q -DforceStdout help:evaluate -Dexpression='project.version')
          echo "Saving com.vaadin artifacts at $VERSION"
          tar cf workspace.tar -C ~/ $(cd ~/ && echo .m2/repository/com/vaadin/*/$VERSION)
          tar rf workspace.tar $(find . -d -name target)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: saved-workspace
          path: workspace.tar
  unit-tests:
    # Unit tests and the codestarts tests drive no browser and need no
    # TestBench licence, so they are one cheap job rather than a matrix — and
    # they run for pull requests from forks, which the licence-bound jobs
    # below cannot.
    needs: build
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{env._HEAD_SHA}}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ github.run_attempt == 1 }}
        with:
          name: saved-workspace
      - name: Restore Workspace
        if: ${{ github.run_attempt == 1 }}
        run: |
          tar xf workspace.tar
          tar cf - .m2 | (cd ~ && tar xf -)
      - name: Compile and Install Vaadin Quarkus
        # cleanup-artifacts removes saved-workspace once the first attempt is
        # over, so a re-run has to rebuild it.
        if: ${{ github.run_attempt > 1 }}
        run: |
          cmd="mvn install -B -ntp -DskipTests -DskipITs"
          eval $cmd -T 2C -q || eval $cmd
      - name: Unit Test
        run: |
          mvn verify -B -ntp -e \
            -pl runtime,deployment,integration-tests/codestarts
      - name: Package test-report files
        if: ${{ always() }}
        run: find . -name surefire-reports -o -name failsafe-reports -o -name "mvn-*.out" | tar -czf tests-report-unit.tgz -T -
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: tests-output-unit
          path: tests-report-*.tgz
  windows-tests:
    # The same browser-free suites on Windows. Most of what behaves
    # differently there is path handling, and the code that does the most of
    # it — the embedded Vaadin plugin adapter and the frontend file handling —
    # is covered by the deployment tests.
    #
    # Builds its own reactor: saved-workspace comes from a Linux runner, and
    # only what these three modules need is installed, so the frontend bundles
    # of the browser test modules are not built here. Needs no secrets, so it
    # runs for pull requests from forks too.
    timeout-minutes: 30
    runs-on: windows-2025
    defaults:
      run:
        # Same shell as the other jobs, so that the report packaging below
        # does not need a PowerShell variant.
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{env._HEAD_SHA}}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Compile and Install Vaadin Quarkus
        run: |
          cmd="mvn install -B -ntp -DskipTests -DskipITs -pl runtime,deployment"
          eval $cmd -T 2C -q || eval $cmd
      - name: Unit Test
        run: |
          mvn verify -B -ntp -e \
            -pl runtime,deployment,integration-tests/codestarts
      - name: Package test-report files
        if: ${{ always() }}
        run: find . -name surefire-reports -o -name failsafe-reports -o -name "mvn-*.out" | tar -czf tests-report-unit-windows.tgz -T -
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: tests-output-unit-windows
          path: tests-report-*.tgz
  it-tests:
    name: it-tests (${{ matrix.name }})
    # TestBench integration tests: need the licence, so not for forks.
    needs: build
    if: ${{ !github.event.pull_request.head.repo.fork }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: production
            module: integration-tests/production
          - name: development
            module: integration-tests/development
          - name: embedded-plugin
            module: integration-tests/embedded-plugin
          - name: push-dispatch
            module: integration-tests/push-dispatch-it
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{env._HEAD_SHA}}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ github.run_attempt == 1 }}
        with:
          name: saved-workspace
      - name: Restore Workspace
        if: ${{ github.run_attempt == 1 }}
        run: |
          tar xf workspace.tar
          tar cf - .m2 | (cd ~ && tar xf -)
      - name: Compile and Install Vaadin Quarkus
        if: ${{ github.run_attempt > 1 }}
        run: |
          cmd="mvn install -B -ntp -DskipTests -DskipITs"
          eval $cmd -T 2C -q || eval $cmd
      - name: Set TB License
        env:
          TB_LICENSE: ${{ secrets.TB_LICENSE }}
        run: |
          mkdir -p ~/.vaadin/
          echo '{"username":"'`echo $TB_LICENSE | cut -d / -f1`'","proKey":"'`echo $TB_LICENSE | cut -d / -f2`'"}' > ~/.vaadin/proKey
      - name: Run ITs
        timeout-minutes: 30
        run: |
          # No -Dcom.vaadin.testbench.Parameters.testsInParallel here: unlike
          # the Flow suites these tests share a single Quarkus application per
          # module, and the suite has never been run in parallel. Flaky runs
          # are retried instead.
          cmd="mvn -V -B -ntp -e -fae -pl ${{ matrix.module }} \
            -Dcom.vaadin.testbench.Parameters.maxAttempts=2 \
            -Dfailsafe.rerunFailingTestsCount=2 \
            -Dmaven.wagon.httpconnectionManager.ttlSeconds=25 \
            -Dmaven.wagon.http.retryHandler.count=3"
          set -x -e
          LOG=mvn-it-tests-${{ matrix.name }}.out
          : > "$LOG"
          # Detach mvn's stdio from this shell so an orphan child JVM (a
          # Quarkus application the failsafe teardown failed to kill) can't pin
          # the step open by holding the pipe to tee, and so the step exits with
          # Maven's status rather than tee's.
          $cmd verify </dev/null >"$LOG" 2>&1 &
          MVN_PID=$!
          tail -f --pid=$MVN_PID "$LOG" &
          wait $MVN_PID
      - name: Kill leftover Java processes
        if: ${{ always() }}
        run: |
          pkill -TERM java || true
          sleep 2
          pkill -KILL java || true
      - name: Package test-report files
        if: ${{ always() }}
        run: find . -name surefire-reports -o -name failsafe-reports -o -name error-screenshots -o -name "mvn-*.out" | tar -czf tests-report-it-${{ matrix.name }}.tgz -T -
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: tests-output-it-${{ matrix.name }}
          path: tests-report-*.tgz
  native-tests:
    # Builds its own reactor rather than restoring saved-workspace: the native
    # image build needs GraalVM, and -Dnative changes how the test module is
    # packaged, so there is nothing in the JDK 21 workspace worth reusing.
    if: ${{ !github.event.pull_request.head.repo.fork }}
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{env._HEAD_SHA}}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ env.GRAALVM_VERSION }}
          distribution: 'graalvm'
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Compile and Install Vaadin Quarkus
        run: |
          cmd="mvn install -B -ntp -DskipTests -DskipITs"
          eval $cmd -T 2C -q || eval $cmd
      - name: Set TB License
        env:
          TB_LICENSE: ${{ secrets.TB_LICENSE }}
        run: |
          mkdir -p ~/.vaadin/
          echo '{"username":"'`echo $TB_LICENSE | cut -d / -f1`'","proKey":"'`echo $TB_LICENSE | cut -d / -f2`'"}' > ~/.vaadin/proKey
      - name: Test with native image
        run: |
          mvn verify -B -ntp -pl :vaadin-quarkus-embedded-plugin-tests -Dnative
      - name: Package test-report files
        if: ${{ always() }}
        run: find . -name surefire-reports -o -name failsafe-reports -o -name error-screenshots -o -name "mvn-*.out" | tar -czf tests-report-native.tgz -T -
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: tests-output-it-native
          path: tests-report-*.tgz
  test-results:
    permissions:
      actions: write
      issues: read
      checks: write
      pull-requests: write
    # Use always() so this job runs on cancellation too. With
    # failure() || success() it would be skipped when any matrix entry was
    # cancelled, and branch protection counts a skipped required check as a
    # passing one. For the same reason this job is not skipped for forks: the
    # licence-bound jobs are, and if the only job left to require were skipped
    # as well, a pull request from a fork would look validated with the
    # integration tests never having run. Only the steps that write back to
    # the pull request are skipped there, since a fork gets a read-only token.
    if: ${{ always() }}
    needs: [build, unit-tests, windows-tests, it-tests, native-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Merge Artifacts
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-output
          pattern: tests-output-*
      # No checkout: the reports come from the artifacts, and nothing here
      # runs code from the repository.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !github.event.pull_request.head.repo.fork }}
        with:
          name: tests-output
      - name: extract downloaded files
        if: ${{ !github.event.pull_request.head.repo.fork }}
        # One directory per archive: the embedded-plugin module runs the same
        # IT classes in the matrix leg and under -Dnative, so both archives
        # carry the same failsafe report paths and extracting them side by
        # side would drop the JVM results. junit_files matches either way.
        run: for i in *.tgz; do d="${i%.tgz}"; mkdir -p "$d" && tar xf "$i" -C "$d"; done
      - name: Publish Unit Test Results
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          junit_files: '**/target/*-reports/TEST*.xml'
          check_run_annotations: all tests, skipped tests
      - name: Set Failure Status
        if: ${{ always() && (needs.build.result != 'success' || needs.unit-tests.result != 'success' || needs.windows-tests.result != 'success' || needs.it-tests.result != 'success' || needs.native-tests.result != 'success') }}
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ "$IS_FORK" = "true" ]; then
            echo "🚫 THE INTEGRATION TESTS DID NOT RUN: they need the TestBench licence, which a pull request from a fork has no access to. Push the branch to this repository and open the pull request from there to validate it." \
              | tee -a $GITHUB_STEP_SUMMARY
          else
            echo "🚫 THERE ARE TEST MODULES WITH FAILURES or BEEN CANCELLED" | tee -a $GITHUB_STEP_SUMMARY
          fi
          exit 1
  cleanup-artifacts:
    permissions:
      actions: write
    # Not skipped for forks either: unit-tests restores the workspace there,
    # so there is an artifact to remove. Deletion goes through the artifact
    # service rather than the API token, so the read-only token is no obstacle.
    if: ${{ always() }}
    needs: [test-results]
    runs-on: ubuntu-24.04
    steps:
      - uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: |
            saved-workspace
