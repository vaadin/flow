name: Update Frontend Dependencies

on:
  schedule:
    # Runs at 04:00 UTC every Monday
    - cron: '0 4 * * 1'
  workflow_dispatch:  # Allow manual trigger

env:
  # The same flags validation.yml sets, for the same reason: a 403 from Central
  # is retried rather than failing the build outright. See the note there.
  MAVEN_ARGS: >-
    -Daether.connector.http.retryHandler.count=3
    -Daether.connector.http.retryHandler.serviceUnavailable=429,500,502,503,504,403
    -Daether.connector.http.connectionMaxTtl=25

jobs:
  update-dependencies:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        branch: [main, '25.3', '25.2', '25.1', '24.10', '24.9']
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ matrix.branch }}
          # Custom token so the created PR triggers CI and can push to the repo
          token: ${{ secrets.VAADIN_BOT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Run dependency update script
        run: |
          chmod +x scripts/update-frontend-dependencies.sh
          ./scripts/update-frontend-dependencies.sh

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version-file: .tool-versions
          distribution: 'temurin'

      # Restore only: scheduled runs save into the default branch's scope,
      # which warm-caches.yml maintains.
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # The script only edits the dependency templates in flow-server. The
      # test-npm production build runs npm install against them, which
      # regenerates its checked-in package-lock.json. flow-maven-plugin is not
      # a dependency of the module, so -am does not build it on its own.
      # -DsharedModules and -Prun-tests put the module in the reactor, which
      # -DskipTests would leave out; -Djetty.skip keeps install from starting
      # the integration test server. If the build fails, keep the old lock and
      # still open the PR, so a bump that breaks the build gets reviewed.
      - name: Update package lock files
        run: |
          cmd="mvn install -B -ntp -DskipTests -DsharedModules -Prun-tests -Djetty.skip -pl flow-plugins/flow-maven-plugin,:flow-test-npm-production -am"
          if ! { $cmd -T 2C -q || $cmd; }; then
            git checkout -- flow-tests/test-frontend/test-npm/package-lock.json
            echo "::warning::Frontend build failed, package-lock.json was not updated"
            {
              echo "LOCK_WARNING<<LOCK_WARNING_EOF"
              echo ""
              echo "Warning: the frontend build failed, so package-lock.json was not"
              echo "updated. See the workflow run for details."
              echo "LOCK_WARNING_EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Determine update strategy description
        run: |
          if [ "${{ matrix.branch }}" = "main" ]; then
            echo "UPDATE_DESC=All new versions (major, minor, patch)" >> $GITHUB_ENV
          else
            echo "UPDATE_DESC=Minor and patch releases (no major)" >> $GITHUB_ENV
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.VAADIN_BOT_TOKEN }}
          branch: update-frontend-dependencies-${{ matrix.branch }}
          base: ${{ matrix.branch }}
          commit-message: |
            chore: Update frontend dependencies (${{ matrix.branch }})
            ${{ env.DEPRECATION_WARNING }}
            ${{ env.LOCK_WARNING }}
          title: "chore: Update frontend dependencies (${{ matrix.branch }})"
          body: |
            ## Automated Frontend Dependency Updates

            This PR contains automated updates to frontend dependencies.

            ### Update Strategy
            - Target Branch: ${{ matrix.branch }}
            - Updates: ${{ env.UPDATE_DESC }}

            ### Changes
            The dependencies have been updated using `npm-check-updates`, and the checked-in `package-lock.json` has been regenerated by a frontend build.

            ---
            *This PR was automatically created by the update-frontend-dependencies workflow.*
          labels: |
            dependencies
            automated
          assignees: |
            ${{ github.repository_owner }}
