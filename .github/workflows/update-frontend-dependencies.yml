name: Update Frontend Dependencies

on:
  schedule:
    # Runs at 04:00 UTC every Monday
    - cron: '0 4 * * 1'
  workflow_dispatch:  # Allow manual trigger

env:
  # The same flags validation.yml sets, for the same reason: a 403 from Central
  # is retried rather than failing the build outright. See the note there.
  MAVEN_ARGS: >-
    -Daether.connector.http.retryHandler.count=3
    -Daether.connector.http.retryHandler.serviceUnavailable=429,500,502,503,504,403
    -Daether.connector.http.connectionMaxTtl=25

jobs:
  update-dependencies:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        branch: [main, '25.3', '25.2', '25.1', '24.10', '24.9']
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ matrix.branch }}
          # Custom token so the created PR triggers CI and can push to the repo
          token: ${{ secrets.VAADIN_BOT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Run dependency update script
        run: |
          chmod +x scripts/update-frontend-dependencies.sh
          ./scripts/update-frontend-dependencies.sh

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version-file: .tool-versions
          distribution: 'temurin'

      # Restore only: scheduled runs save into the default branch's scope,
      # which warm-caches.yml maintains.
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # The script only edits the dependency templates in flow-server. Every
      # checked-in file that Flow fills from those templates is regenerated by
      # building its Maven module:
      # - a package-lock.json whose package.json is not checked in, or carries
      #   the "vaadin" block Flow writes, is rewritten by npm install;
      # - a checked-in package.json that carries the "vaadin" block but has no
      #   lock next to it (kept for its hand-written local package links) is
      #   rewritten in place by Flow. Without this, its pinned versions fall
      #   behind the templates and Dependabot security updates target them.
      #   The development pom is used: prepare-frontend already updates the
      #   template versions, while a production build would also rewrite
      #   the overrides and drop entries in the hand-maintained file.
      # For locks the production pom is preferred when a module has one; a
      # directory without a pom is skipped so it cannot fail the whole build. flow-maven-plugin is not a dependency of the
      # test modules, so -am does not build it on its own.
      # -DsharedModules and -Prun-tests put the test modules in the reactor,
      # which -DskipTests would leave out; -Djetty.skip keeps install from
      # starting the integration test server. The modules' clean deletes
      # package*.json at the start of the build, so a lock that is missing
      # afterwards was not rewritten. If the build fails or a lock is missing,
      # keep the old files and still open the PR, so a bump that breaks the
      # build gets reviewed.
      - name: Update package lock files
        run: |
          locks=()
          packages=()
          modules=flow-plugins/flow-maven-plugin
          has_vaadin_block() {
            node -e 'process.exit(require(process.argv[1]).vaadin ? 0 : 1)' "./$1"
          }
          module_of() {
            if [ -f "$1/pom-production.xml" ]; then
              echo "$1/pom-production.xml"
            elif [ -f "$1/pom.xml" ]; then
              echo "$1"
            fi
          }
          for lock in $(git ls-files ':(glob)**/package-lock.json'); do
            dir=$(dirname "$lock")
            if git ls-files --error-unmatch "$dir/package.json" > /dev/null 2>&1 \
                && ! has_vaadin_block "$dir/package.json"; then
              continue
            fi
            pom=$(module_of "$dir")
            if [ -z "$pom" ]; then
              echo "::warning::Skipping $lock, no Maven module in $dir"
              continue
            fi
            locks+=("$lock")
            modules+=",$pom"
          done
          for package in $(git ls-files ':(glob)**/package.json'); do
            dir=$(dirname "$package")
            if [ -f "$dir/package-lock.json" ] || ! has_vaadin_block "$package"; then
              continue
            fi
            # Test fixtures outside a Maven module are not generated files
            [ -f "$dir/pom.xml" ] || continue
            packages+=("$package")
            modules+=",$dir"
          done
          if [ ${#locks[@]} -eq 0 ] && [ ${#packages[@]} -eq 0 ]; then
            echo "No generated package-lock.json or package.json files found"
            echo "LOCK_STATUS=No generated \`package-lock.json\` or \`package.json\` files were found to regenerate." >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Updating: ${locks[*]} ${packages[*]}"
          cmd="mvn install -B -ntp -DskipTests -DsharedModules -Prun-tests -Djetty.skip -pl $modules -am"
          if { $cmd -T 2C -q || $cmd; }; then
            reason="the frontend build did not rewrite them"
            failed=()
            for lock in "${locks[@]}"; do
              [ -f "$lock" ] || failed+=("$lock")
            done
          else
            reason="the frontend build failed"
            failed=("${locks[@]}" "${packages[@]}")
          fi
          if [ ${#failed[@]} -eq 0 ]; then
            echo "LOCK_STATUS=These files have been regenerated by a frontend build: ${locks[*]} ${packages[*]}" >> "$GITHUB_ENV"
            exit 0
          fi
          git checkout -- "${failed[@]}"
          echo "::warning::Not updated because $reason: ${failed[*]}"
          echo "LOCK_STATUS=Warning: these files were not updated because $reason: ${failed[*]}. See the workflow run for details." >> "$GITHUB_ENV"
          {
            echo "LOCK_WARNING<<LOCK_WARNING_EOF"
            echo ""
            echo "Warning: these files were not updated because"
            echo "$reason: ${failed[*]}. See the workflow run for details."
            echo "LOCK_WARNING_EOF"
          } >> "$GITHUB_ENV"

      - name: Determine update strategy description
        run: |
          if [ "${{ matrix.branch }}" = "main" ]; then
            echo "UPDATE_DESC=All new versions (major, minor, patch)" >> $GITHUB_ENV
          else
            echo "UPDATE_DESC=Minor and patch releases (no major)" >> $GITHUB_ENV
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.VAADIN_BOT_TOKEN }}
          branch: update-frontend-dependencies-${{ matrix.branch }}
          base: ${{ matrix.branch }}
          commit-message: |
            chore: Update frontend dependencies (${{ matrix.branch }})
            ${{ env.DEPRECATION_WARNING }}
            ${{ env.LOCK_WARNING }}
          title: "chore: Update frontend dependencies (${{ matrix.branch }})"
          body: |
            ## Automated Frontend Dependency Updates

            This PR contains automated updates to frontend dependencies.

            ### Update Strategy
            - Target Branch: ${{ matrix.branch }}
            - Updates: ${{ env.UPDATE_DESC }}

            ### Changes
            The dependencies have been updated using `npm-check-updates`.

            ${{ env.LOCK_STATUS }}

            ---
            *This PR was automatically created by the update-frontend-dependencies workflow.*
          labels: |
            dependencies
            automated
          assignees: |
            ${{ github.repository_owner }}
