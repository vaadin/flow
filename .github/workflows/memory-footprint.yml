name: Memory Footprint

# Measures the memory a UI uses, with UIMemoryFootprintTest, on the head of a
# pull request and on the commit it branches from, and reports the difference
# in a pull request comment. The measurements are exact, so a comment is only
# posted once a change affects them. After that the comment is updated on every
# push, also when the difference goes away again.
#
# The measurements of a commit only depend on the JDK and on the files of the
# modules the test is built with, which `scripts/memoryFootprint.js paths`
# reads from the poms of the commit. They are cached under a key made of
# those, and a commit is only measured when no commit with the same files was
# measured before. The workflow runs for every push, since a commit that does
# not change those files finds both measurements cached and ends early. A pull
# request can only restore what its own runs or runs on its base branch cached,
# so main is measured on every push as well: the base of a pull request is
# then almost always cached, and only its head is measured.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  # Only the newest commit is worth measuring
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  _HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  _BASE_SHA: ${{ github.event.pull_request.base.sha }}
  _PR_NUMBER: ${{ github.event.number }}
  # The same flags validation.yml sets, for the same reason: a 403 from Central
  # is retried rather than failing the build outright. See the note there.
  MAVEN_ARGS: >-
    -Daether.connector.http.retryHandler.count=3
    -Daether.connector.http.retryHandler.serviceUnavailable=429,500,502,503,504,403
    -Daether.connector.http.connectionMaxTtl=25
  # Builds only the modules the test needs, and runs only the test
  MEASURE: >-
    mvn package -B -ntp -pl flow-html-components -am
    -Dtest=UIMemoryFootprintTest -Dsurefire.failIfNoSpecifiedTests=false
    -Djacoco.skip
  # Where a cached measurement is restored to and saved from. The path is part
  # of the cache version, so it has to be the same for the head and the base.
  CACHED: ${{ github.workspace }}/.memory-footprint

jobs:
  measure:
    # Commenting needs a token that can write, which GitHub does not hand to
    # pull requests from forks
    if: ${{ !github.event.pull_request.head.repo.fork }}
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ env._HEAD_SHA }}
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version-file: .tool-versions
          distribution: 'temurin'
      - name: Find the commits to measure
        id: commits
        # The base is the commit the pull request branches from, so that
        # changes merged to the base branch since then are not attributed to
        # the pull request. The keys hold the exact JDK version, as object
        # sizes can differ between JDK versions.
        run: |
          runtime=$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^ *java.runtime.version = //p')
          # Assigned before use, so that a failure to read the poms fails the
          # step instead of hashing an empty list of paths
          key() {
            local paths
            paths=$(node scripts/memoryFootprint.js paths "$1") || return 1
            for path in $paths; do
              echo "$path $(git rev-parse "$1:$path")"
            done | sha256sum | cut -c1-40
          }
          head_key=$(key "$_HEAD_SHA")
          echo "head-key=memory-footprint-$runtime-$head_key" >> "$GITHUB_OUTPUT"
          if [ -n "$_BASE_SHA" ]; then
            base=$(git merge-base "$_BASE_SHA" "$_HEAD_SHA")
            base_key=$(key "$base")
            echo "base=$base" >> "$GITHUB_OUTPUT"
            echo "base-key=memory-footprint-$runtime-$base_key" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore the head measurements
        id: head-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.CACHED }}
          key: ${{ steps.commits.outputs.head-key }}
      - name: Move the head measurements aside
        if: steps.head-cache.outputs.cache-hit == 'true'
        run: mv "$CACHED" "$RUNNER_TEMP/memory-head"
      - name: Restore the base measurements
        id: base-cache
        if: steps.commits.outputs.base
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.CACHED }}
          key: ${{ steps.commits.outputs.base-key }}
      - name: Move the base measurements aside
        if: steps.base-cache.outputs.cache-hit == 'true'
        run: mv "$CACHED" "$RUNNER_TEMP/memory-base"
      - name: Check what is left to measure
        id: todo
        env:
          HEAD_CACHED: ${{ steps.head-cache.outputs.cache-hit }}
          BASE: ${{ steps.commits.outputs.base }}
          BASE_CACHED: ${{ steps.base-cache.outputs.cache-hit }}
        # Before UIMemoryFootprintTest was added the base has nothing to
        # measure, which the comment says instead of comparing
        run: |
          [ "$HEAD_CACHED" = "true" ] || echo "head=true" >> "$GITHUB_OUTPUT"
          if [ -n "$BASE" ] && [ "$BASE_CACHED" != "true" ] \
            && git cat-file -e "$BASE:flow-html-components/src/test/java/com/vaadin/flow/memory/UIMemoryFootprintTest.java" 2>/dev/null; then
            echo "base=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup-frontend-tools
        if: steps.todo.outputs.head || steps.todo.outputs.base
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        if: steps.todo.outputs.head || steps.todo.outputs.base
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Measure the head
        if: steps.todo.outputs.head
        run: |
          $MEASURE
          mv flow-html-components/target/memory-footprint "$CACHED"
      - name: Cache the head measurements
        if: steps.todo.outputs.head
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.CACHED }}
          key: ${{ steps.commits.outputs.head-key }}
      - name: Move the head measurements aside
        if: steps.todo.outputs.head
        run: mv "$CACHED" "$RUNNER_TEMP/memory-head"
      - name: Measure the base
        if: steps.todo.outputs.base
        env:
          BASE: ${{ steps.commits.outputs.base }}
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          cd "$RUNNER_TEMP/base"
          $MEASURE
          mv flow-html-components/target/memory-footprint "$CACHED"
      - name: Cache the base measurements
        if: steps.todo.outputs.base
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.CACHED }}
          key: ${{ steps.commits.outputs.base-key }}
      - name: Move the base measurements aside
        if: steps.todo.outputs.base
        run: mv "$CACHED" "$RUNNER_TEMP/memory-base"
      - name: Compare
        id: compare
        if: github.event_name == 'pull_request'
        run: |
          node scripts/memoryFootprint.js "$RUNNER_TEMP/memory-base" "$RUNNER_TEMP/memory-head" \
            "${{ steps.commits.outputs.base }}"
          cat memory-comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment the difference on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED: ${{ steps.compare.outputs.changed }}
        run: |
          marker='<!-- flow-memory-footprint -->'
          existing=$(gh api "repos/${{ github.repository }}/issues/$_PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$marker\")) | .id] | first // empty")
          existing=${existing%%$'\n'*}
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$existing" -F body=@memory-comment.md
          elif [ "$CHANGED" = "true" ]; then
            gh api "repos/${{ github.repository }}/issues/$_PR_NUMBER/comments" -F body=@memory-comment.md
          else
            echo "No change in memory footprint, and no earlier comment to update"
          fi
