name: Reverse Proxy Tests

# Runs the push tests and a selection of general integration tests of
# flow-tests/test-root-context, the push tests without Atmosphere on Jetty,
# Spring Boot (Tomcat) and Quarkus, and the CDI tests on Payara, through
# reverse proxies that terminate HTTPS, like the proxies applications are
# deployed behind. Each proxy runs with a configuration tuned for Vaadin
# (recommended) and with a minimal one that leaves the defaults of the proxy in
# place (default), see ReverseProxy in flow-test-util. The proxies run in Docker
# containers started by Testcontainers.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The same flags validation.yml sets, for the same reason: a 403 from Central
  # is retried rather than failing the build outright. See the note there.
  MAVEN_ARGS: >-
    -Daether.connector.http.retryHandler.count=3
    -Daether.connector.http.retryHandler.serviceUnavailable=429,500,502,503,504,403
    -Daether.connector.http.connectionMaxTtl=25

jobs:
  reverse-proxy:
    name: ${{ matrix.proxy }} (${{ matrix.config }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        proxy: [nginx, caddy]
        config: [recommended, default]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/setup-frontend-tools
      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version-file: .tool-versions
          distribution: 'temurin'
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Set TB License
        env:
          TB_LICENSE: ${{ secrets.TB_LICENSE }}
        run: |
          mkdir -p ~/.vaadin/
          echo '{"username":"'"$(echo "$TB_LICENSE" | cut -d / -f1)"'","proKey":"'"$(echo "$TB_LICENSE" | cut -d / -f2)"'"}' > ~/.vaadin/proKey
      - name: Build
        run: >-
          mvn -B -ntp -T 1C install -DskipTests -Pit-shared-modules,it-test-modules
          -pl flow-tests/test-root-context,flow-tests/test-push-sse-pure,flow-tests/test-lumo,flow-tests/test-lumo-theme,vaadin-spring,vaadin-quarkus/deployment,vaadin-cdi
          -am
      - name: Run the tests through ${{ matrix.proxy }}
        run: >-
          mvn -B -ntp -fae verify -Pit-shared-modules
          -pl flow-tests/test-root-context,flow-tests/test-push-sse-pure,flow-tests/vaadin-spring-tests/test-spring-boot-sse-pure
          -Dreverse.proxy=${{ matrix.proxy }}
          -Dreverse.proxy.config=${{ matrix.config }}
      - name: Run the Quarkus tests through ${{ matrix.proxy }}
        if: ${{ !cancelled() }}
        run: >-
          mvn -B -ntp verify -f flow-tests/vaadin-quarkus-tests/pom.xml
          -pl push-sse-pure-it -am
          -Dreverse.proxy=${{ matrix.proxy }}
          -Dreverse.proxy.config=${{ matrix.config }}
      # nginx does not pass the Upgrade header on by default, so the websocket
      # push tests are left out with that configuration, as in
      # flow-tests/test-root-context/reverse-proxy/nginx-default-excludes.txt
      - name: Run the Payara CDI tests through ${{ matrix.proxy }}
        if: ${{ !cancelled() }}
        run: >-
          mvn -B -ntp verify -pl flow-tests/vaadin-cdi-tests -Ppayara
          -Dcom.vaadin.testbench.Parameters.maxAttempts=2
          -Dreverse.proxy=${{ matrix.proxy }}
          -Dreverse.proxy.config=${{ matrix.config }}
          ${{ matrix.proxy == 'nginx' && matrix.config == 'default' && '-Dtest=!PushTest#ws*,!PushWithoutManagedExecutorTest#ws*' || '' }}
      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reverse-proxy-${{ matrix.proxy }}-${{ matrix.config }}
          path: |
            flow-tests/test-root-context/target/failsafe-reports/
            flow-tests/test-root-context/target/jetty-start.out
            flow-tests/test-push-sse-pure/target/failsafe-reports/
            flow-tests/test-push-sse-pure/target/jetty-start.out
            flow-tests/vaadin-spring-tests/test-spring-boot-sse-pure/target/failsafe-reports/
            flow-tests/vaadin-quarkus-tests/push-sse-pure-it/target/failsafe-reports/
            flow-tests/vaadin-quarkus-tests/push-sse-pure-it/target/quarkus.log
            flow-tests/vaadin-cdi-tests/target/surefire-reports/
