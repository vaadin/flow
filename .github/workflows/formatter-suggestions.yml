name: Formatter Suggestions

# Reports the result of formatter.yml on the pull request: a comment listing
# the files that are not formatted, and a review suggesting the changes
# `mvn spotless:apply` makes, so that the author can accept them from the pull
# request page. See scripts/formatterSuggestions.js.
#
# formatter.yml runs code of the pull request and so gets no write access, as
# a pull request from a fork does not get it anyway. This workflow has write
# access, so it runs from the default branch and only reads the diff uploaded
# by that run as text: it neither checks out nor runs anything from the pull
# request.
on:
  workflow_run:
    workflows: [Formatter]
    types: [completed]

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{
    github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report:
    name: Suggest formatting changes
    # Merge groups have no pull request to report on, and a cancelled run was
    # superseded by a newer one
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout scripts
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Download formatter diff
        id: download
        # Missing when the formatter run failed before uploading it, which
        # leaves nothing to report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: formatter-diff
          path: ${{ runner.temp }}/formatter-diff
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Report on the pull request
        if: steps.download.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DIFF_FILE: ${{ runner.temp }}/formatter-diff/formatter-diff.txt
        with:
          script: |
            const { run } = require('./scripts/formatterSuggestions.js');
            await run({ github, context, core, diffFile: process.env.DIFF_FILE });
