name: Update @since tags

# Reconcile Javadoc @since tags for any branch against the published release
# history, and open a PR with the result. The reconciliation engine and caching
# live in the shared vaadin/github-actions/reconcile-since-tags action; the target branch is
# chosen at dispatch time (the version is derived from that branch's pom).

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to reconcile (the PR is opened against it)
        required: true
        default: main
      dev:
        description: Target version override (blank = derive major.minor from pom)
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  reconcile:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Disable git hooks (husky isn't set up in CI)
        run: git config core.hooksPath /dev/null

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version-file: .tool-versions
          cache: maven

      # The shared step reconciles every module the checked-out branch builds:
      # the root pom's <module> entries that have Java sources. Deriving the
      # list from the branch keeps it right on branches that predate a module
      # (e.g. flow-build-tools before 25.0) or carry one main no longer has.
      # Excluded are modules whose sources are not public API (client-side
      # code, test helpers, tooling) and the ones reconciled against their
      # own index below.
      # Pooling is only correct for modules on flow-server's release timeline
      # (see vaadin-spring below), so a module with any release flow-server
      # does not have fails the run: it needs an isolated step and an exclude
      # entry instead. An unpublished module has no history and is skipped.
      - id: modules
        name: List modules to reconcile
        run: |
          exclude=" flow-client flow-test-util flow-test-generic flow-devloop-daemon flow-polymer2lit vaadin-spring vaadin-cdi vaadin-quarkus "
          shared=""
          versions() {
            curl -sS --fail --max-time 60 --retry 4 --retry-all-errors \
              "https://repo1.maven.org/maven2/com/vaadin/$1/maven-metadata.xml" \
              | sed -n 's:.*<version>\(.*\)</version>.*:\1:p' | sort -u
          }
          versions flow-server > "$RUNNER_TEMP/flow-server-versions"
          while read -r m; do
            if [ ! -d "$m/src/main/java" ] || [[ "$exclude" == *" $m "* ]]; then
              continue
            fi
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 \
              "https://repo1.maven.org/maven2/com/vaadin/$m/maven-metadata.xml")
            if [ "$code" = 404 ]; then
              echo "Skipping $m: not published yet"
              continue
            fi
            foreign=$(versions "$m" | comm -23 - "$RUNNER_TEMP/flow-server-versions")
            if [ -n "$foreign" ]; then
              echo "::error::$m has releases flow-server does not ($(echo "$foreign" | head -3 | xargs)...)." \
                "Pooling it would rewrite @since across the framework; give it an isolated index step."
              exit 1
            fi
            shared="$shared$m"$'\n'
          done < <(sed -n 's:.*<module>\(.*\)</module>.*:\1:p' pom.xml)
          [ -n "$shared" ] || { echo "No modules to reconcile found in pom.xml"; exit 1; }
          printf 'Shared index modules:\n%s' "$shared"
          printf 'shared<<EOF\n%sEOF\n' "$shared" >> "$GITHUB_OUTPUT"

      - id: since
        uses: vaadin/github-actions/reconcile-since-tags@452570a6575db482f7a602673b26fbe891422f65
        with:
          group-id: com.vaadin
          version: ${{ inputs.dev }}
          artifacts: ${{ steps.modules.outputs.shared }}

      # vaadin-spring MUST reconcile against its own isolated index (index-dir),
      # never the shared one above. Why: the tool merges every listed module's
      # releases onto a single version axis and derives @since as the start of the
      # unbroken "present" streak reaching the latest release. That is only correct
      # when all pooled modules share one release timeline (the shared axis then
      # equals each module's own timeline). vaadin-spring does NOT share it: under
      # the same com.vaadin:vaadin-spring GAV it kept its own scheme -- ~64 releases
      # in the 10.x-19.x range -- before aligning with the platform at 23.x. Flow
      # itself jumped straight from 9.2 to 23.0 with nothing in between, so pooling
      # vaadin-spring drops those 64 versions into Flow's gap. flow-server is absent
      # from all of them, so the streak for every pre-23 Flow type would break there
      # and silently rewrite @since from its true 1.x-9.x value to 23.0 across most
      # of the framework. An isolated index-dir keeps vaadin-spring's versions off
      # the shared axis (a separate load + axis per invocation).
      - uses: vaadin/github-actions/reconcile-since-tags@452570a6575db482f7a602673b26fbe891422f65
        with:
          group-id: com.vaadin
          version: ${{ inputs.dev }}
          index-dir: .since-index-spring
          artifacts: |
            vaadin-spring

      # vaadin-cdi needs its own isolated index for the same reason vaadin-spring
      # does, and the reasoning above applies unchanged: under the same
      # com.vaadin:vaadin-cdi GAV it kept its own scheme -- 46 releases from
      # 1.0.0.alpha1 to 16.1.2 -- before the module was imported into this
      # repository and started releasing with Flow's version number. Pooling
      # those onto the shared axis would drop 16.x into the gap between Flow 9.2
      # and 23.0 and rewrite @since across most of the framework.
      # Branches older than the import have no vaadin-cdi module, so the step
      # is skipped there instead of failing on a missing source root.
      - if: hashFiles('vaadin-cdi/pom.xml') != ''
        uses: vaadin/github-actions/reconcile-since-tags@452570a6575db482f7a602673b26fbe891422f65
        with:
          group-id: com.vaadin
          version: ${{ inputs.dev }}
          index-dir: .since-index-cdi
          artifacts: |
            vaadin-cdi

      # vaadin-quarkus, the same again: under com.vaadin:vaadin-quarkus it ran
      # its own 1.0-3.1 scheme, one line per supported Vaadin version, before
      # the extension was imported into this repository and started releasing
      # with Flow's version number. Its deployment artifact carries no public
      # API of its own -- it is Quarkus build steps -- so only the runtime
      # artifact is indexed. Its module directory is not named after the
      # artifact, so the source root is spelled out. Skipped on branches older
      # than the import, like vaadin-cdi above.
      - if: hashFiles('vaadin-quarkus/pom.xml') != ''
        uses: vaadin/github-actions/reconcile-since-tags@452570a6575db482f7a602673b26fbe891422f65
        with:
          group-id: com.vaadin
          version: ${{ inputs.dev }}
          index-dir: .since-index-quarkus
          artifacts: |
            vaadin-quarkus=vaadin-quarkus/runtime/src/main/java

      - name: Open pull request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          base: ${{ inputs.branch }}
          branch: since-tags/${{ inputs.branch }}
          add-paths: "**/*.java"
          title: "docs: reconcile @since tags (${{ steps.since.outputs.version }})"
          commit-message: |
            docs: reconcile @since tags

            Automated reconciliation against the published release history:
            add missing tags, correct wrong ones, create minimal @since javadoc
            for undocumented types, and remove redundant tags.
          body: |
            Automated `@since` reconciliation for `${{ inputs.branch }}` (version `${{ steps.since.outputs.version }}`).

            Generated via [`vaadin/github-actions/reconcile-since-tags`](https://github.com/vaadin/github-actions/tree/main/reconcile-since-tags). See the run's job summary for counts.
          delete-branch: true
