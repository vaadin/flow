name: PR Risk Tests

# Runs the tests of the PR risk scripts (.github/pr-risk) when they change.
# They need no dependencies: the SDKs are only loaded to call a model.
on:
  pull_request:
    paths:
      - '.github/pr-risk/**'
      - '.github/workflows/pr-risk*.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/pr-risk

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.13.0'

      - name: Test PR risk policy
        working-directory: .github/pr-risk
        run: npm test
