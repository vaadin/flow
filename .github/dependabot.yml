# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    exclude-paths:
      - "flow-plugins/flow-maven-plugin/src/it"
    ignore:
      # vaadin-quarkus targets the latest Quarkus LTS release as its baseline.
      # Moving to a newer minor or major version is a deliberate decision, so
      # only patch releases of the current LTS are proposed.
      - dependency-name: "io.quarkus:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Stay on ClassGraph 4.x. ClassGraph 6 requires JDK 25 or newer, while
      # Flow still supports JDK 21, and moving to 5.x is a deliberate decision.
      - dependency-name: "io.github.classgraph:classgraph"
        versions: [">= 5"]
      # Stay on Jackson LTS releases. 3.1 is an LTS release and 3.4 is expected
      # to be the next one, so the non-LTS 3.2 and 3.3 releases are skipped.
      - dependency-name: "tools.jackson*"
        versions: ["[3.2,3.4)"]
