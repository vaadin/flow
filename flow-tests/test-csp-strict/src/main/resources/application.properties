# Filled in by Maven resource filtering from the server.port property of the
# pom, which the tests also receive as the serverPort system property.
server.port=${server.port}

# The setting this module pins: Vaadin sends a nonce-based
# Content-Security-Policy and the string-based JavaScript APIs throw.
vaadin.csp=strict

# The policy is only sent in production mode. The production bundle is built
# by the flow-maven-plugin build-frontend goal, see pom.xml.
vaadin.productionMode=true
