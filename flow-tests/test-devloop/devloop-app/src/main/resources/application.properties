# Not 8080: a developer running this on their own machine very likely has
# something there already, and the daemon would report a port clash rather than a
# test failure. Kept in step with <server.port> in pom.xml by hand.
server.port=8899

# The daemon owns this process and decides when a change goes live, so nothing
# else may push to the browser on its own.
vaadin.frontend.hotdeploy=false

# Tomcat caches what it serves from META-INF/resources for 5 seconds and
# revalidates on that TTL alone, never on the file's timestamp - so a fetch
# right after an apply can be served the pre-edit bytes even though the daemon
# has already copied the new ones onto the classpath. That window is what made
# DevLoopCssIT.cssEdit_refreshesWhatTheServerServes flaky: it asserts on one
# immediate fetch, which is the right assertion for the copy it is testing, and
# the cache is unrelated noise in front of it.
server.tomcat.resource.allow-caching=false
